name: Build Android Mesa

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [ "aarch64" ]
      fail-fast: false
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang \
            python3-pip \
            python3-packaging \
            pkg-config \
            flex bison \
            gettext \
            libwayland-dev \
            wayland-protocols \
            libdrm-dev \
            libexpat1-dev \
            libz-dev \
            ccache
          pip3 install mako meson ninja

      - name: Set environment variables
        run: |
          echo "NDK_PATH=${{ github.workspace }}/android-ndk" >> $GITHUB_ENV
          echo "API_LEVEL=33" >> $GITHUB_ENV
          echo "MESA_VERSION=23.3.0" >> $GITHUB_ENV

      - name: Download NDK
        run: |
          NDK_VER="r27c"
          curl -L "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          mv android-ndk-${NDK_VER} ${{ env.NDK_PATH }}

      - name: Clone Mesa
        run: |
          git clone --branch ${{ env.MESA_VERSION }} --single-branch https://gitlab.freedesktop.org/mesa/mesa.git
          
      - name: Create cross file
        run: |
          cat > crossfile.txt << 'EOF'
          [binaries]
          c = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang'
          cpp = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang++'
          ar = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'

          [properties]
          c_args = ['-Wno-error=implicit-function-declaration']
          cpp_args = ['-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          c_link_args = []
          cpp_link_args = ['-static-libstdc++']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Build Mesa for Android
        run: |
          cd mesa
          meson setup build-android \
            --cross-file ../crossfile.txt \
            --prefix=/tmp/mesa-install \
            -Dplatforms=android \
            -Dplatform-sdk-version=${{ env.API_LEVEL }} \
            -Dandroid-stub=true \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers= \
            -Dopengl=true \
            -Degl=enabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dshared-glapi=enabled \
            -Dllvm=disabled \
            -Dglx=disabled \
            -Dosmesa=false \
            -Dbuildtype=release \
            -Db_lto=false

          meson compile -C build-android
          meson install -C build-android

      - name: Verify built libraries
        run: |
          find /tmp/mesa-install -type f -name "*.so" -o -name "*.a" | head -20
          ls -la /tmp/mesa-install/lib/

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: Mesa_Android_${{ matrix.arch }}
          path: /tmp/mesa-install/
