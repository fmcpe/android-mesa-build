name: Build Android Mesa

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [ "arm32", "aarch64", "x86_64" ]
      fail-fast: false
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libxrandr-dev libxxf86vm-dev libxcb-* libx11-xcb-dev libxfixes-dev libdrm-dev libx11-dev
          pip3 install mako meson ninja

      - name: Set environment variables
        run: |
          echo "NDK_VER=android-ndk-r27c" >> $GITHUB_ENV
          echo "SDK_VER=29" >> $GITHUB_ENV
          echo "WORK_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Download NDK & clone Mesa / DRM
        run: |
          curl -L https://dl.google.com/android/repository/${NDK_VER}-linux.zip -o ${NDK_VER}-linux.zip
          unzip ${NDK_VER}-linux.zip
          git clone https://gitlab.freedesktop.org/mesa/drm.git
          git clone https://gitlab.freedesktop.org/mesa/mesa.git

      - name: Patch Mesa to include NEON support in BLAKE3
        run: |
          echo "Applying patch to include blake3_neon.S"
          cd mesa
          git apply << 'EOF'
          diff --git a/src/util/blake3/meson.build b/src/util/blake3/meson.build
          index abcdef0..1234567 100644
          --- a/src/util/blake3/meson.build
          +++ b/src/util/blake3/meson.build
          @@
             blake3_files = files(
               'blake3.c',
               'blake3_dispatch.c',
               'blake3_portable.c',
             )
          +
          +if host_machine.cpu_family() == 'aarch64'
          +  blake3_files += files('blake3_neon.S')
          +endif
          EOF
          cd ..

      - name: Build DRM (Freedreno dependency)
        run: |
          envsubst < android-drm-${{ matrix.arch }} > build-crossfile-drm
          cd drm
          meson setup build-android \
            --prefix=/tmp/drm-static \
            --cross-file ../build-crossfile-drm \
            -Ddefault_library=static \
            -Dintel=disabled \
            -Dradeon=disabled \
            -Damdgpu=disabled \
            -Dnouveau=disabled \
            -Dvmwgfx=disabled \
            -Dfreedreno=enabled \
            -Dvc4=disabled \
            -Detnaviv=disabled \
            -Dfreedreno-kgsl=true
          ninja -C build-android install
          cd ..

      - name: Build Mesa for Android
        run: |
          envsubst < android-${{ matrix.arch }} > build-crossfile
          cd mesa
          meson setup build-android \
            --prefix=/tmp/mesa \
            --cross-file ../build-crossfile \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=false \
            -Dandroid-strict=false \
            -Dxlib-lease=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Dllvm=disabled \
            -Dopengl=true \
            -Dvulkan-drivers="" \
            -Dgallium-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dbuildtype=release
          ninja -C build-android install

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: Mesa_${{ matrix.arch }}
          path: /tmp/mesa/lib/*
