name: Build Android Mesa

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [ "aarch64" ]
      fail-fast: false
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang \
            python3-pip \
            python3-packaging \
            pkg-config \
            flex bison \
            gettext \
            libwayland-dev \
            wayland-protocols \
            libdrm-dev \
            libexpat1-dev \
            libz-dev \
            ccache \
            libssl-dev \
            libxml2-dev \
            zlib1g-dev
          pip3 install mako meson ninja

      - name: Set environment variables
        run: |
          echo "NDK_PATH=${{ github.workspace }}/android-ndk" >> $GITHUB_ENV
          echo "API_LEVEL=33" >> $GITHUB_ENV
          echo "MESA_SRC_DIR=${{ github.workspace }}/mesa" >> $GITHUB_ENV

      - name: Download NDK
        run: |
          NDK_VER="r27c"
          curl -L "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          mv android-ndk-${NDK_VER} ${{ env.NDK_PATH }}

      - name: Clone Mesa
        run: |
          git clone https://gitlab.freedesktop.org/mesa/mesa.git

      - name: Build OpenSSL for Android
        run: |
          cd mesa
          ./scripts/install-android-openssl.sh

      - name: Create cross file
        run: |
          cat > crossfile.txt << EOF
          [binaries]
          c = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang'
          cpp = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang++'
          ar = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          c_args = ['-Wno-error=implicit-function-declaration', '-I${{ env.MESA_SRC_DIR }}/subprojects/openssl/include']
          cpp_args = ['-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++', '-I${{ env.MESA_SRC_DIR }}/subprojects/openssl/include']
          c_link_args = ['-L${{ env.MESA_SRC_DIR }}/subprojects/openssl/lib/arm64-v8a']
          cpp_link_args = ['-static-libstdc++', '-L${{ env.MESA_SRC_DIR }}/subprojects/openssl/lib/arm64-v8a']
          EOF

      - name: Build Mesa for Android
        run: |
          cd mesa
          meson setup build-android \
            --cross-file ../crossfile.txt \
            --prefix=/tmp/mesa-install \
            -Dplatforms=android \
            -Dplatform-sdk-version=${{ env.API_LEVEL }} \
            -Dandroid-stub=true \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers= \
            -Dopengl=true \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshared-glapi=disabled \
            -Dllvm=disabled \
            -Dglx=disabled \
            -Dbuildtype=release \
            -Db_lto=false

          meson compile -C build-android
          meson install -C build-android

      - name: Verify built libraries
        run: |
          echo "=== Built libraries ==="
          find /tmp/mesa-install -name "*.so" -o -name "*.a" | head -20
          echo "=== Library directory contents ==="
          ls -la /tmp/mesa-install/lib/ || echo "lib/ directory not found"
          ls -la /tmp/mesa-install/lib64/ || echo "lib64/ directory not found"

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: Mesa_Android_${{ matrix.arch }}
          path: |
            /tmp/mesa-install/lib/
            /tmp/mesa-install/lib64/
          if-no-files-found: error
