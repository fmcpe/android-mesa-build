name: Build Android Mesa

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        arch: [ "aarch64" ]
      fail-fast: false
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang \
            python3-pip \
            python3-packaging \
            pkg-config \
            flex bison
          pip3 install mako meson ninja

      - name: Set environment variables
        run: |
          echo "NDK_PATH=${{ github.workspace }}/android-ndk" >> $GITHUB_ENV
          echo "API_LEVEL=34" >> $GITHUB_ENV

      - name: Download NDK
        run: |
          NDK_VER="r27c"
          curl -L "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o ndk.zip
          unzip -q ndk.zip
          mv android-ndk-${NDK_VER} ${{ env.NDK_PATH }}

      - name: Create cross file for ${{ matrix.arch }}
        run: |
          cat > crossfile.txt << EOF
          [binaries]
          c = ['ccache', '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang']
          cpp = ['ccache', '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          ar = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-ar'
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = '${{ env.NDK_PATH }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Clone Mesa
        run: |
          git clone https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          git checkout $(git tag -l '*.0' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -n1)

      - name: Build Mesa for Android
        run: |
          cd mesa
          meson setup build-android \
            --cross-file ../crossfile.txt \
            --prefix=/tmp/mesa-install \
            -Dplatforms=android \
            -Dplatform-sdk-version=${{ env.API_LEVEL }} \
            -Dandroid-stub=true \
            -Dgallium-drivers=freedreno \
            -Dvulkan-drivers= \
            -Dopengl=true \
            -Degl=enabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dshared-glapi=enabled \
            -Dllvm=disabled \
            -Dbuildtype=release

          meson compile -C build-android
          meson install -C build-android

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: Mesa_Android_${{ matrix.arch }}
          path: /tmp/mesa-install/
